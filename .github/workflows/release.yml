name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag da release (ex. v0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            target: libretro
            artifact: lupinho_libretro.so
          - name: macos
            os: macos-latest
            target: libretro
            artifact: lupinho_libretro.dylib
          - name: windows
            os: ubuntu-latest
            target: libretro-win
            artifact: lupinho_libretro.dll

    steps:
      - uses: actions/checkout@v7

      # actions/checkout recurses into every nested gitlink while setting up
      # submodule auth. lupinho records src/libs/linux/raylib with no URL, and
      # the core does not compile it, so init only the direct submodules.
      - name: Checkout submodules
        run: git submodule update --init --depth 1

      - name: Install Linux deps
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential zlib1g-dev

      - name: Install MinGW (Windows core)
        if: matrix.name == 'windows'
        run: sudo apt-get update && sudo apt-get install -y make gcc-mingw-w64-x86-64 libz-mingw-w64-dev

      - name: Build
        run: make ${{ matrix.target }}

      - name: Upload core
        uses: actions/upload-artifact@v7
        with:
          name: lupinho-libretro-${{ matrix.name }}
          path: |
            dist/${{ matrix.artifact }}
            dist/lupinho_libretro.info
          if-no-files-found: error

  release:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download cores
        uses: actions/download-artifact@v7
        with:
          pattern: lupinho-libretro-*
          path: artifacts

      - name: Collect release files
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.ref_name }}"
          fi
          case "$tag" in
            v*) ;;
            *) echo "tag must look like v0.1.0, got: $tag" >&2; exit 1 ;;
          esac
          echo "name=$tag" >> "$GITHUB_OUTPUT"

          mkdir -p release
          cp artifacts/lupinho-libretro-linux/lupinho_libretro.so release/
          cp artifacts/lupinho-libretro-macos/lupinho_libretro.dylib release/
          cp artifacts/lupinho-libretro-windows/lupinho_libretro.dll release/
          cp artifacts/lupinho-libretro-linux/lupinho_libretro.info release/
          ls -l release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/lupinho_libretro.so
            release/lupinho_libretro.dylib
            release/lupinho_libretro.dll
            release/lupinho_libretro.info
